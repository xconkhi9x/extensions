name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/keiyoushi/extensions.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Rebase onto upstream
        run: git rebase upstream/repo
        # Replace 'main' if upstream uses 'master' or something else

      - name: Push rebased changes back to fork
        env:
          TOKEN: ${{ secrets.GIT_PASSWORD }}
        run: |
          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }} HEAD:main --force-with-lease
