name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:    # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the fork repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # Use PAT for pushing later

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/keiyoushi/extensions.git

      - name: Fetch upstream changes
        run: git fetch upstream

      - name: Merge upstream changes
        run: git merge upstream/repo --allow-unrelated-histories --no-edit
        # Replace 'main' above with the upstream's default branch if different

      - name: Push changes back to fork
        env:
          TOKEN: ${{ secrets.GIT_PASSWORD }}
        run: |
          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }} HEAD:main
